<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LOYAL TRANSLATE">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>LOYAL TRANSLATE</title>
  <style>
    *{box-sizing:border-box}:root{--bg:#070b0e;--panel:#101317;--line:#252b33;--text:#f4f6f7;--muted:#949ba7;--accent:#c8ff3d}
    html,body{width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%}
    body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
    .appShell{position:fixed;inset:0;background:radial-gradient(circle at 18% 8%,rgba(200,255,61,.08),transparent 27%),var(--bg)}
    .frameWrap{position:absolute;top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);overflow:hidden;background:var(--bg)}
    iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
    .splash{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 20%,rgba(200,255,61,.11),transparent 34%),var(--bg);transition:opacity .22s ease,visibility .22s ease}
    .loaded .splash{opacity:0;visibility:hidden;pointer-events:none}.splashCard{text-align:center;max-width:330px}.splashIcon{width:88px;height:88px;object-fit:cover;border-radius:24px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.splashTitle{margin-top:14px;color:var(--text);font-size:13px;font-weight:900;letter-spacing:.12em}.splashSub{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}
    .splashActions{display:none;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}.slow .splashActions,.offline .splashActions{display:flex}.splashBtn{min-height:42px;border-radius:11px;padding:0 13px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:800;font-size:11px;cursor:pointer}.splashBtn.primary{background:var(--accent);border-color:var(--accent);color:#080a08}.offline .splashSub::after{content:' You appear to be offline.';color:#ffca55}
  </style>
</head>
<body>
  <main class="appShell" id="shell">
    <div class="splash">
      <div class="splashCard">
        <img class="splashIcon" src="app-icon.png" alt="">
        <div class="splashTitle">LOYAL TRANSLATE</div>
        <div class="splashSub" id="splashText">Opening your workspace…</div>
        <div class="splashActions"><button class="splashBtn primary" type="button" onclick="reloadApp()">Retry</button><button class="splashBtn" type="button" onclick="openDirect()">Open direct</button></div>
      </div>
    </div>
    <div class="frameWrap"><iframe id="appFrame" src="https://script.google.com/macros/s/AKfycby8BB4INSOyelHoQj63C6tqH9EuwRFkDLdvHTnwPZKtG_CoxxpPr-JerplpRtkPb-gnzw/exec" title="LOYAL TRANSLATE" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe></div>
  </main>
  <script>
    const BACKEND_URL="https://script.google.com/macros/s/AKfycby8BB4INSOyelHoQj63C6tqH9EuwRFkDLdvHTnwPZKtG_CoxxpPr-JerplpRtkPb-gnzw/exec";
    const shell=document.getElementById('shell'), frame=document.getElementById('appFrame');
    const AUTH={session:'lt_session',trusted:'lt_trusted_device'};
    function read(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
    function write(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k)}catch(e){}}
    function reloadApp(){shell.classList.remove('loaded','slow');frame.src=BACKEND_URL+(BACKEND_URL.includes('?')?'&':'?')+'_='+Date.now()}
    function openDirect(){location.href=BACKEND_URL}
    frame.addEventListener('load',()=>{shell.classList.add('loaded');shell.classList.remove('slow')});
    setTimeout(()=>{if(!shell.classList.contains('loaded'))shell.classList.add('slow')},8000);
    function onlineState(){shell.classList.toggle('offline',!navigator.onLine)}window.addEventListener('online',onlineState);window.addEventListener('offline',onlineState);onlineState();

    window.addEventListener('message',event=>{
      const d=event.data||{};
      if(!d||typeof d.type!=='string'||!d.type.startsWith('LT_'))return;
      if(d.type==='LT_GET_AUTH'){
        try{event.source.postMessage({type:'LT_AUTH_STATE',sessionToken:read(AUTH.session),trustedDeviceToken:read(AUTH.trusted)},event.origin||'*')}catch(e){}
      }else if(d.type==='LT_SET_AUTH'){
        write(AUTH.session,String(d.sessionToken||''));write(AUTH.trusted,String(d.trustedDeviceToken||''));
      }else if(d.type==='LT_CLEAR_AUTH'){write(AUTH.session,'');write(AUTH.trusted,'')}
    });

    if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  </script>
</body>
</html>
